<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>درجات الأحمر — مأوى العقارية</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23020001'/%3E%3Ctext x='50' y='70' font-family='Arial' font-weight='900' font-size='54' fill='%23FF3637' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--black:#020001;--sec:#101010;--white:#F4F0EB;--gray:#A19B97;--border:#292626;--f:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif}
body{font-family:var(--f);background:var(--black);color:var(--white);line-height:1.6;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:48px 24px 80px}
.head{text-align:center;margin-bottom:14px}
.head h1{font-weight:700;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.5px}
.head p{color:var(--gray);margin-top:8px;font-size:.95rem}
.current{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px auto;padding:12px 20px;border:1px dashed var(--border);border-radius:30px;width:max-content;font-size:.88rem;color:var(--gray)}
.current .dot{width:20px;height:20px;border-radius:50%;background:#FF3637;box-shadow:0 0 0 4px rgba(255,54,55,.15)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:36px}
.card{background:var(--sec);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-4px)}
.swatch{height:120px;display:flex;align-items:flex-end;padding:16px}
.swatch .hex{font-weight:700;font-size:1rem;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);padding:6px 14px;border-radius:30px;font-family:'IBM Plex Sans',monospace}
.body{padding:20px}
.body .name{font-weight:700;font-size:1.1rem}
.body .en{color:var(--gray);font-size:.8rem;font-family:'IBM Plex Sans',sans-serif}
.preview{margin-top:16px;padding:16px;border-radius:12px;background:var(--black);border:1px solid var(--border)}
.preview .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:8px;font-weight:700;font-size:.9rem;color:#fff;border:none;cursor:default}
.txt{font-weight:700;font-size:1rem}
.bar{height:6px;border-radius:6px;margin-top:12px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:10px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>درجات الأحمر المقترحة</h1>
    <p>10 بدائل للون الأحمر المعتمد — اختر الأنسب للهوية السينمائية.</p>
  </div>
  <div class="current"><span class="dot"></span> المعتمد حالياً: <b>#FF3637</b></div>

  <div class="grid" id="grid"></div>
</div>

<script>
const reds=[
  {hex:'#DC143C', ar:'كريمسون', en:'Crimson'},
  {hex:'#E10600', ar:'أحمر إشارة', en:'Signal Red'},
  {hex:'#E34234', ar:'فارمليون', en:'Vermilion'},
  {hex:'#FF2400', ar:'سكارلت', en:'Scarlet'},
  {hex:'#D2042D', ar:'كرزي', en:'Cherry Red'},
  {hex:'#BE2A29', ar:'كارمين', en:'Carmine'},
  {hex:'#C00040', ar:'روبي', en:'Ruby'},
  {hex:'#FF4D4D', ar:'مرجاني فاتح', en:'Coral'},
  {hex:'#A4243B', ar:'نبيذي', en:'Wine'},
  {hex:'#FF6347', ar:'طماطم', en:'Tomato'},
];
const grid=document.getElementById('grid');
grid.innerHTML=reds.map(r=>`
  <div class="card">
    <div class="swatch" style="background:${r.hex}"><span class="hex">${r.hex}</span></div>
    <div class="body">
      <div class="name">${r.ar}</div>
      <div class="en">${r.en}</div>
      <div class="preview">
        <div class="row">
          <button class="btn" style="background:${r.hex}">اطلب الآن ←</button>
          <span class="txt" style="color:${r.hex}">نص مميّز</span>
        </div>
        <div class="bar" style="background:${r.hex}"></div>
        <span class="tag" style="color:${r.hex};border:1px solid ${r.hex}55">عرض مخصّص</span>
      </div>
    </div>
  </div>`).join('');
</script>
</body>
</html>
