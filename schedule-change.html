<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>تعديل موعد الحجز | مأوى</title><style>
:root{color-scheme:light dark;--brand:#a4243b;--green:#18794e;--red:#c9364f;--bg:#f1efec;--paper:#fbfaf7;--ink:#211e1c;--muted:#746d67;--line:#e2ddd7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}main{max-width:680px;margin:32px auto;padding:0 12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 14px 38px #1c181412}.top{height:5px;background:var(--brand)}header{padding:24px;text-align:center;background:#090808!important}header img{display:block;width:170px;max-width:100%;height:auto;margin:auto}.content{padding:30px}.badge{display:inline-block;padding:7px 11px;background:#f7eff0;color:var(--brand);border-radius:99px;font-size:11px;font-weight:800}h1{font-size:26px;margin:14px 0 8px}.lead{color:var(--muted);line-height:1.8;margin:0 0 22px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}.box{padding:15px;background:#fff;border:1px solid var(--line);border-radius:11px}.label{font-size:11px;color:var(--muted);margin-bottom:6px}.value{font-weight:800}label{display:block;font-size:12px;font-weight:800;margin:16px 0 7px}input,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:90px;resize:vertical}button{width:100%;border:0;border-radius:9px;padding:14px;background:var(--brand);color:#fff;font:900 14px Tahoma;cursor:pointer;margin-top:18px}button:disabled{opacity:.55}.msg{display:none;margin-top:16px;padding:14px;border-radius:10px;line-height:1.7}.ok{display:block;background:#e9f7ef;color:var(--green)}.err{display:block;background:#fbecef;color:var(--red)}footer{text-align:center;padding:18px;background:#ece8e3;color:var(--muted);font-size:11px}footer a{color:inherit;text-decoration:none}@media(max-width:520px){main{margin:10px auto}.content{padding:22px 18px}.info{grid-template-columns:1fr}h1{font-size:23px}}@media(prefers-color-scheme:dark){:root{--bg:#11100f;--paper:#191715;--ink:#f6f2ed;--muted:#b5ada6;--line:#3d3936}.panel{box-shadow:none}.box,input,textarea{background:#211f1d}.badge{background:#281c1f}footer{background:#121110}}
</style></head><body><main><section class="panel"><div class="top"></div><header><img src="assets/logo2026/mawa-wide-white.svg" alt="مأوى"></header><div class="content"><span class="badge" id="badge">تعديل موعد الحجز</span><h1 id="title">اختيار موعد جديد</h1><p class="lead" id="lead">اختر الموعد المناسب، وسيصل طلبك إلى مأوى للمراجعة والموافقة.</p><div class="info" id="info"><div class="box"><div class="label">رقم العقد</div><div class="value" dir="ltr" id="number">—</div></div><div class="box"><div class="label">الموعد الحالي</div><div class="value" id="current">—</div></div></div><form id="form"><label for="start">التاريخ والوقت المقترحان</label><input id="start" type="datetime-local" required><label for="reason">ملاحظة أو سبب التعديل (اختياري)</label><textarea id="reason" maxlength="500" placeholder="مثال: أفضّل الفترة المسائية"></textarea><button id="submit" type="submit">إرسال الطلب إلى مأوى</button></form><div class="msg" id="msg"></div></div><footer><a href="mailto:info@maawaa.sa">info@maawaa.sa</a> · <a href="https://instagram.com/maawaasa">@maawaasa</a> · <a href="https://www.maawaa.sa">www.maawaa.sa</a></footer></section></main><script>
const API='https://fivrwlowntwacfrsocge.supabase.co/functions/v1/schedule-change',q=new URLSearchParams(location.search),id=q.get('c'),sig=q.get('s'),mode=q.get('mode'),token=q.get('token'),decision=q.get('decision');const $=x=>document.getElementById(x),post=async body=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'request_failed');return b},show=(text,ok)=>{$('msg').textContent=text;$('msg').className='msg '+(ok?'ok':'err')};
async function init(){try{if(mode==='decision'){document.title='قرار تعديل الموعد | مأوى';$('info').style.display='none';$('form').style.display='none';const isApprove=decision==='approve';$('badge').textContent=isApprove?'موافقة على الموعد':'رفض الطلب';$('badge').style.background=isApprove?'#e9f7ef':'#fbecef';$('badge').style.color=isApprove?'#18794e':'#c9364f';$('title').textContent=isApprove?'تأكيد الموافقة على الموعد الجديد':'تأكيد رفض طلب التعديل';$('lead').textContent=isApprove?'سيتم تحديث الحجز وإشعار العميل والمصور.':'سيتم إشعار العميل بعدم اعتماد الموعد المقترح.';const box=document.createElement('div');box.style.cssText='display:flex;gap:10px;margin-top:18px;flex-wrap:wrap';const yes=document.createElement('button');yes.textContent=isApprove?'نعم، اعتمد الموعد':'نعم، ارفض الطلب';yes.style.cssText='flex:1;min-width:150px;padding:13px;border:0;border-radius:9px;background:'+(isApprove?'#18794e':'#c9364f')+';color:#fff;font-weight:800;font-size:14px;cursor:pointer';const no=document.createElement('button');no.textContent='إلغاء';no.style.cssText='flex:1;min-width:100px;padding:13px;border:1px solid #cfc8c1;border-radius:9px;background:#fff;color:#444;font-weight:700;font-size:14px;cursor:pointer';box.append(yes,no);$('msg').before(box);no.onclick=()=>{box.remove();$('title').textContent='لم يتم تنفيذ القرار';$('lead').textContent='يمكنك إغلاق هذه الصفحة الآن.'};yes.onclick=async()=>{yes.disabled=true;no.disabled=true;yes.textContent='جارٍ التنفيذ…';try{const r=await post({action:'decide',token,decision});box.remove();$('badge').textContent=r.decision==='approved'?'تمت الموافقة':'تم الرفض';$('badge').style.background=r.decision==='approved'?'#e9f7ef':'#fbecef';$('badge').style.color=r.decision==='approved'?'#18794e':'#c9364f';$('title').textContent=r.decision==='approved'?'تم اعتماد الموعد الجديد':'تم رفض الموعد المقترح';$('lead').textContent=r.decision==='approved'?'تم تحديث الحجز وإشعار العميل والمصور بنجاح.':'تم إشعار العميل، ويمكنه تقديم موعد بديل.'}catch(e){box.remove();$('badge').textContent='تعذر التنفيذ';$('badge').style.background='#fbecef';$('badge').style.color='#c9364f';$('title').textContent='تعذر تسجيل القرار';$('lead').textContent='حاول مرة أخرى أو تواصل مع مأوى عبر واتساب 966531646152+'}};return}const d=await post({action:'details',contract_id:id,signature:sig});$('number').textContent=d.contract_number;$('current').textContent=d.current_date||'غير محدد';const min=new Date(d.min_start);min.setMinutes(min.getMinutes()-min.getTimezoneOffset());$('start').min=min.toISOString().slice(0,16);if(d.pending){$('form').style.display='none';show('يوجد طلب تعديل قيد مراجعة مأوى بالفعل.',true)}}catch(e){$('form').style.display='none';$('info').style.display='none';$('title').textContent='تعذر فتح الطلب';$('lead').textContent='الرابط غير صالح أو سبق استخدامه. تواصل مع مأوى للمساعدة.'}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;try{const local=new Date($('start').value);await post({action:'submit',contract_id:id,signature:sig,proposed_start:local.toISOString(),reason:$('reason').value});$('form').style.display='none';show('تم إرسال الموعد المقترح إلى مأوى. سنبلغك فور مراجعته.',true)}catch(err){show(err.message==='date_too_soon'?'يجب أن يكون الموعد بعد 48 ساعة على الأقل.':'تعذر إرسال الطلب. تحقّق من الموعد وحاول مجددًا.',false);$('submit').disabled=false}});init();
</script></body></html>
