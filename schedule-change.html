<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>تعديل موعد الحجز | مأوى</title><style>
@font-face{font-family:'Thmanyah Serif';src:url("/assets/fonts/thmanyah/thmanyahseriftext-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:'Thmanyah Serif';src:url("/assets/fonts/thmanyah/thmanyahseriftext-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url("/assets/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url("/assets/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url("/assets/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--bg:#F5F5F3;--ink:#0B0B0C;--text2:#3A3C40;--grey:#62666C;--line:rgba(154,160,168,.38);--line2:rgba(154,160,168,.55);
  --teal:#0E3F4E;--teal-rgb:14,63,78;--teal-hi-rgb:119,168,186;--shade-rgb:30,32,36;--err:#9A3324;
  --disp:'Thmanyah Serif','Times New Roman',serif;--ar:'Thmanyah Sans','Geeza Pro',Tahoma,system-ui,sans-serif;--swash:"salt","swsh","dlig";--ease:cubic-bezier(.22,1,.36,1);
  --g-num:linear-gradient(180deg,#B5BBC3 18%,#8C939C 38%,#555C66 55%,#9AA1AA 70%,#4A5059 86%);
  --rim:linear-gradient(225deg,rgba(var(--teal-hi-rgb),.95) 0%,#fff 9%,rgba(var(--teal-hi-rgb),.95) 19%,rgba(var(--teal-rgb),.3) 50%,rgba(var(--teal-hi-rgb),.7) 82%,rgba(var(--teal-rgb),.75) 100%)}
::selection{background:rgba(var(--teal-rgb),.18)}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
:root{color-scheme:light dark;--brand:#0B0B0C;--green:#0E3F4E;--red:#9A3324;--paper:#FFFFFF;--muted:#62666C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:var(--ar);color:var(--ink);-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:32px auto;padding:0 12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 30px 70px -40px rgba(var(--shade-rgb),.45)}
.top{height:3px;background:linear-gradient(90deg,var(--teal),#77A8BA 50%,var(--teal))}
header{padding:26px;text-align:center;background:radial-gradient(70% 140% at 88% 0%,rgba(150,158,170,.3),transparent 70%),radial-gradient(60% 140% at 0% 100%,rgba(30,88,110,.5),transparent 70%),#0E0F11!important}
header img{display:block;width:170px;max-width:100%;height:auto;margin:auto}
.content{padding:30px}
.badge{display:inline-block;padding:7px 12px;background:#EEF3F4;color:var(--teal);border-radius:99px;font-size:12px;font-weight:600}
h1{font-family:var(--disp);font-weight:700;font-feature-settings:var(--swash);font-size:28px;line-height:1.4;margin:14px 0 8px}
.lead{color:var(--muted);line-height:1.8;margin:0 0 22px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.box{padding:15px;background:#F7F8F8;border:1px solid var(--line);border-radius:14px}
.label{font-size:12px;color:var(--muted);margin-bottom:6px}
.value{font-weight:700}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--ink);font:inherit;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(var(--teal-rgb),.12)}
textarea{min-height:90px;resize:vertical}
button{width:100%;border:0;border-radius:999px;padding:15px;background:var(--brand);color:#F3F4F6;font:600 15px var(--ar);cursor:pointer;margin-top:18px}
button:disabled{opacity:.55}
.msg{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.7}
.ok{display:block;background:#EEF3F4;color:var(--green)}
.err{display:block;background:#F6EEEC;color:var(--red)}
footer{text-align:center;padding:18px;background:#F0F1F1;color:var(--muted);font-size:12px}
footer a{color:inherit;text-decoration:none}
@media(max-width:520px){main{margin:10px auto}.content{padding:22px 18px}.info{grid-template-columns:1fr}h1{font-size:24px}}
@media(prefers-color-scheme:dark){:root{--bg:#0E0F11;--paper:#15171A;--ink:#F3F4F6;--muted:#A3A9B2;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.2)}.panel{box-shadow:none}.box,input,textarea{background:#1C1F23}.badge{background:rgba(119,168,186,.14);color:#9CC3D0}button{background:#F3F4F6;color:#0B0B0C}.ok{background:rgba(119,168,186,.14);color:#9CC3D0}.err{background:rgba(154,51,36,.2);color:#E5A79B}footer{background:#0E0F11}}

/* حقول التاريخ: كروم بلغة عربية يعرض «يوم/شهر/سنة» بحروف معكوسة — هذا يعيدها لترتيبها الصحيح ولا يمسّ القيمة */
input[type=date]::-webkit-datetime-edit-day-field,input[type=date]::-webkit-datetime-edit-month-field,input[type=date]::-webkit-datetime-edit-year-field{direction:rtl!important;unicode-bidi:normal!important}
</style></head><body><main><section class="panel"><div class="top"></div><header><img src="assets/logo2026/mawa-wide-white.svg" alt="مأوى"></header><div class="content"><span class="badge" id="badge">تعديل موعد الحجز</span><h1 id="title">اختيار موعد جديد</h1><p class="lead" id="lead">اختر الموعد المناسب، وسيصل طلبك إلى مأوى للمراجعة والموافقة.</p><div class="info" id="info"><div class="box"><div class="label">رقم العقد</div><div class="value" dir="ltr" id="number">—</div></div><div class="box"><div class="label">الموعد الحالي</div><div class="value" id="current">—</div></div></div><form id="form"><label for="start">التاريخ والوقت المقترحان</label><input id="start" type="datetime-local" required><label for="reason">ملاحظة أو سبب التعديل (اختياري)</label><textarea id="reason" maxlength="500" placeholder="مثال: أفضّل الفترة المسائية"></textarea><button id="submit" type="submit">إرسال الطلب إلى مأوى</button></form><div class="msg" id="msg"></div></div><footer><a href="mailto:info@maawaa.sa">info@maawaa.sa</a> · <a href="https://instagram.com/maawaasa">@maawaasa</a> · <a href="https://www.maawaa.sa">www.maawaa.sa</a></footer></section></main><script>
const API='https://fivrwlowntwacfrsocge.supabase.co/functions/v1/schedule-change',q=new URLSearchParams(location.search),id=q.get('c'),sig=q.get('s'),mode=q.get('mode'),token=q.get('token'),decision=q.get('decision');const $=x=>document.getElementById(x),post=async body=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'request_failed');return b},show=(text,ok)=>{$('msg').textContent=text;$('msg').className='msg '+(ok?'ok':'err')};
async function init(){try{if(mode==='decision'){document.title='قرار تعديل الموعد | مأوى';$('info').style.display='none';$('form').style.display='none';const isApprove=decision==='approve';$('badge').textContent=isApprove?'موافقة على الموعد':'رفض الطلب';$('badge').style.background=isApprove?'#EEF3F4':'#F6EEEC';$('badge').style.color=isApprove?'#0E3F4E':'#9A3324';$('title').textContent=isApprove?'تأكيد الموافقة على الموعد الجديد':'تأكيد رفض طلب التعديل';$('lead').textContent=isApprove?'سيتم تحديث الحجز وإشعار العميل والمصور.':'سيتم إشعار العميل بعدم اعتماد الموعد المقترح.';const box=document.createElement('div');box.style.cssText='display:flex;gap:10px;margin-top:18px;flex-wrap:wrap';const yes=document.createElement('button');yes.textContent=isApprove?'نعم، اعتمد الموعد':'نعم، ارفض الطلب';yes.style.cssText='flex:1;min-width:150px;padding:13px;border:0;border-radius:9px;background:'+(isApprove?'#0E3F4E':'#9A3324')+';color:#fff;font-weight:800;font-size:14px;cursor:pointer';const no=document.createElement('button');no.textContent='إلغاء';no.style.cssText='flex:1;min-width:100px;padding:13px;border:1px solid #D3D6DA;border-radius:9px;background:#fff;color:#3A3C40;font-weight:700;font-size:14px;cursor:pointer';box.append(yes,no);$('msg').before(box);no.onclick=()=>{box.remove();$('title').textContent='لم يتم تنفيذ القرار';$('lead').textContent='يمكنك إغلاق هذه الصفحة الآن.'};yes.onclick=async()=>{yes.disabled=true;no.disabled=true;yes.textContent='جارٍ التنفيذ…';try{const r=await post({action:'decide',token,decision});box.remove();$('badge').textContent=r.decision==='approved'?'تمت الموافقة':'تم الرفض';$('badge').style.background=r.decision==='approved'?'#EEF3F4':'#F6EEEC';$('badge').style.color=r.decision==='approved'?'#0E3F4E':'#9A3324';$('title').textContent=r.decision==='approved'?'تم اعتماد الموعد الجديد':'تم رفض الموعد المقترح';$('lead').textContent=r.decision==='approved'?'تم تحديث الحجز وإشعار العميل والمصور بنجاح.':'تم إشعار العميل، ويمكنه تقديم موعد بديل.'}catch(e){box.remove();$('badge').textContent='تعذر التنفيذ';$('badge').style.background='#fbecef';$('badge').style.color='#c9364f';$('title').textContent='تعذر تسجيل القرار';$('lead').textContent='حاول مرة أخرى أو تواصل مع مأوى عبر واتساب 966531646152+'}};return}const d=await post({action:'details',contract_id:id,signature:sig});$('number').textContent=d.contract_number;$('current').textContent=d.current_date||'غير محدد';const min=new Date(d.min_start);min.setMinutes(min.getMinutes()-min.getTimezoneOffset());$('start').min=min.toISOString().slice(0,16);if(d.pending){$('form').style.display='none';show('يوجد طلب تعديل قيد مراجعة مأوى بالفعل.',true)}}catch(e){$('form').style.display='none';$('info').style.display='none';$('title').textContent='تعذر فتح الطلب';$('lead').textContent='الرابط غير صالح أو سبق استخدامه. تواصل مع مأوى للمساعدة.'}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;try{const local=new Date($('start').value);await post({action:'submit',contract_id:id,signature:sig,proposed_start:local.toISOString(),reason:$('reason').value});$('form').style.display='none';show('تم إرسال الموعد المقترح إلى مأوى. سنبلغك فور مراجعته.',true)}catch(err){show(err.message==='date_too_soon'?'يجب أن يكون الموعد بعد 48 ساعة على الأقل.':'تعذر إرسال الطلب. تحقّق من الموعد وحاول مجددًا.',false);$('submit').disabled=false}});init();
</script></body></html>
