<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الرد على طلب مأوى</title><script src="assets/js/supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f0ede8;color:#211e1c;font-family:Tahoma,Arial}.card{max-width:560px;margin:12vh auto;background:#fff;border-radius:18px;padding:32px;box-shadow:0 14px 50px #0002;text-align:center;border-top:5px solid #a4243b}.status{padding:16px;border-radius:10px;background:#f7f4f0;line-height:1.8}.ok{background:#e8f6ee;color:#16663a}.err{background:#fdeaea;color:#8d2335}</style></head><body><main class="card"><img src="assets/logo2026/mawa-wide.svg" alt="مأوى" width="170"><h1>الرد على طلب التصوير</h1><div class="status" id="status">جاري تسجيل ردك…</div></main><script>const p=new URLSearchParams(location.search),box=document.getElementById('status');fetch('https://fivrwlowntwacfrsocge.supabase.co/functions/v1/operations-automation',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action:'respond',token:p.get('token'),decision:p.get('decision')})}).then(async r=>({ok:r.ok,body:await r.json()})).then(({ok,body})=>{if(ok){box.className='status ok';box.textContent=body.decision==='accepted'?'تم قبول الطلب وتسجيله باسم المصور بنجاح.':'تم رفض الطلب، وسيقترح النظام المصور التالي.'}else{box.className='status err';box.textContent=body.error==='already_answered'?'سبق تسجيل الرد على هذا الطلب.':body.error==='expired'?'انتهت صلاحية رابط الطلب.':'تعذر تسجيل الرد أو أن الرابط غير صالح.'}}).catch(()=>{box.className='status err';box.textContent='تعذر الاتصال بالنظام. أعد المحاولة بعد قليل.'})</script></body></html>
