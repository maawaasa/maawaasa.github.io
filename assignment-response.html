<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الرد على طلب مأوى</title><script src="assets/js/supabase-config.js"></script><style>
@font-face{font-family:'Thmanyah Serif';src:url("/assets/fonts/thmanyah/thmanyahseriftext-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:'Thmanyah Serif';src:url("/assets/fonts/thmanyah/thmanyahseriftext-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url("/assets/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url("/assets/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url("/assets/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--bg:#F5F5F3;--ink:#0B0B0C;--text2:#3A3C40;--grey:#62666C;--line:rgba(154,160,168,.38);--line2:rgba(154,160,168,.55);
  --teal:#0E3F4E;--teal-rgb:14,63,78;--teal-hi-rgb:119,168,186;--shade-rgb:30,32,36;--err:#9A3324;
  --disp:'Thmanyah Serif','Times New Roman',serif;--ar:'Thmanyah Sans','Geeza Pro',Tahoma,system-ui,sans-serif;--swash:"salt","swsh","dlig";--ease:cubic-bezier(.22,1,.36,1);
  --g-num:linear-gradient(180deg,#B5BBC3 18%,#8C939C 38%,#555C66 55%,#9AA1AA 70%,#4A5059 86%);
  --rim:linear-gradient(225deg,rgba(var(--teal-hi-rgb),.95) 0%,#fff 9%,rgba(var(--teal-hi-rgb),.95) 19%,rgba(var(--teal-rgb),.3) 50%,rgba(var(--teal-hi-rgb),.7) 82%,rgba(var(--teal-rgb),.75) 100%)}
::selection{background:rgba(var(--teal-rgb),.18)}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 85% 0%,rgba(var(--teal-hi-rgb),.18),transparent 65%)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);-webkit-font-smoothing:antialiased}
.card{position:relative;z-index:1;max-width:560px;margin:12vh auto;background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 #fff,0 30px 70px -40px rgba(var(--shade-rgb),.45),0 46px 90px -56px rgba(var(--teal-rgb),.4);border-radius:26px;padding:34px 32px;text-align:center}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:var(--rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card img{display:block;margin:0 auto}
h1{font-family:var(--disp);font-weight:700;font-feature-settings:var(--swash);font-size:24px;line-height:1.45;margin:18px 0 14px}
.status{padding:16px;border-radius:14px;background:#F6F7F7;line-height:1.8;color:var(--text2)}
.ok{background:#EEF3F4;color:var(--teal)}
.err{background:#F6EEEC;color:var(--err)}
</style></head><body><main class="card"><img src="assets/logo2026/mawa-wide.svg" alt="مأوى" width="170"><h1>الرد على طلب التصوير</h1><div class="status" id="status">جاري تسجيل ردك…</div></main><script>const p=new URLSearchParams(location.search),box=document.getElementById('status');fetch('https://fivrwlowntwacfrsocge.supabase.co/functions/v1/operations-automation',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action:'respond',token:p.get('token'),decision:p.get('decision')})}).then(async r=>({ok:r.ok,body:await r.json()})).then(({ok,body})=>{if(ok){box.className='status ok';box.textContent=body.decision==='accepted'?'تم قبول الطلب وتسجيله باسم المصور بنجاح.':'تم رفض الطلب، وسيقترح النظام المصور التالي.'}else{box.className='status err';box.textContent=body.error==='already_answered'?'سبق تسجيل الرد على هذا الطلب.':body.error==='expired'?'انتهت صلاحية رابط الطلب.':'تعذر تسجيل الرد أو أن الرابط غير صالح.'}}).catch(()=>{box.className='status err';box.textContent='تعذر الاتصال بالنظام. أعد المحاولة بعد قليل.'})</script></body></html>
