<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة | مأوى للتصوير العقاري</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23020001'/%3E%3Ctext x='50' y='70' font-family='Arial' font-weight='900' font-size='54' fill='%23A4243B' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:#020001;color:#FBFAF6;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:24px}
.box{max-width:480px}
h1{font-size:64px;margin:0 0 8px;color:#A4243B}
p{color:#b9b4ab;line-height:1.9;margin:0 0 28px}
a.btn{display:inline-block;background:#A4243B;color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-weight:600;margin:0 6px 10px}
a.ghost{background:transparent;border:1px solid #3a3733;color:#FBFAF6}
</style>
<script>
/* دعم الروابط العميقة للحاسبة على الاستضافة الثابتة:
   /calculator/... يصلك هنا فنحفظ بقية المسار وننتقل للحاسبة، وهي تطبّق القيم وتعيد الشريط لنفس العنوان النظيف. */
(function(){
  var m=/^\/calculator(\/|$)/i.exec(location.pathname);
  if(!m) return;
  var rest=location.pathname.replace(/^\/calculator\/?/i,'');
  if(!/^[\w+.\-\/]*$/.test(rest)) rest='';
  try{ sessionStorage.setItem('mawaCalcDeep',rest); }catch(e){}
  location.replace('/calculator/');
})();
</script>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <p>الصفحة التي تبحث عنها غير موجودة أو تغيّر عنوانها.</p>
  <a class="btn" href="/">العودة للرئيسية</a>
  <a class="btn ghost" href="/calculator/">حاسبة الأسعار</a>
</div>
</body>
</html>
