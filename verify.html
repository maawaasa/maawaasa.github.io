<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التحقق من عقد مأوى</title>
<script src="assets/js/supabase-config.js"></script>
<style>
@font-face{font-family:'Thmanyah Serif';src:url("/assets/fonts/thmanyah/thmanyahseriftext-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:'Thmanyah Serif';src:url("/assets/fonts/thmanyah/thmanyahseriftext-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url("/assets/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url("/assets/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url("/assets/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--bg:#F5F5F3;--ink:#0B0B0C;--text2:#3A3C40;--grey:#62666C;--line:rgba(154,160,168,.38);--line2:rgba(154,160,168,.55);
  --teal:#0E3F4E;--teal-rgb:14,63,78;--teal-hi-rgb:119,168,186;--shade-rgb:30,32,36;--err:#9A3324;
  --disp:'Thmanyah Serif','Times New Roman',serif;--ar:'Thmanyah Sans','Geeza Pro',Tahoma,system-ui,sans-serif;--swash:"salt","swsh","dlig";--ease:cubic-bezier(.22,1,.36,1);
  --g-num:linear-gradient(180deg,#B5BBC3 18%,#8C939C 38%,#555C66 55%,#9AA1AA 70%,#4A5059 86%);
  --rim:linear-gradient(225deg,rgba(var(--teal-hi-rgb),.95) 0%,#fff 9%,rgba(var(--teal-hi-rgb),.95) 19%,rgba(var(--teal-rgb),.3) 50%,rgba(var(--teal-hi-rgb),.7) 82%,rgba(var(--teal-rgb),.75) 100%)}
::selection{background:rgba(var(--teal-rgb),.18)}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 45% at 85% 0%,rgba(var(--teal-hi-rgb),.18),transparent 65%)}
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#0E3F4E;--mut:#62666C;--green:#0E3F4E}
body{font-family:var(--ar);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
.card{position:relative;z-index:1;background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 #fff,0 30px 70px -40px rgba(var(--shade-rgb),.45),0 46px 90px -56px rgba(var(--teal-rgb),.4);border-radius:28px;max-width:420px;width:100%;padding:36px 30px;text-align:center}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:var(--rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.logo{height:30px;width:auto;display:block;margin:0 auto 22px}
.icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px}
.ok{background:#EEF3F4;color:var(--teal)}
.bad{background:#F6EEEC;color:var(--err)}
h1{font-family:var(--disp);font-weight:700;font-feature-settings:var(--swash);font-size:1.45rem;line-height:1.45;margin-bottom:8px}
p{font-size:.95rem;color:var(--mut);line-height:1.9}
.row{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;padding:11px 0;border-bottom:1px solid var(--line);text-align:right}
.row b{color:var(--ink)}
.badge{display:inline-block;border-radius:999px;padding:4px 14px;font-size:.78rem;font-weight:600;margin-top:6px}
.sent{background:#EEF3F4;color:var(--teal)}
.pending{background:#F0F1F2;color:var(--text2)}
.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:r 1s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="assets/logo2026/mawa-wide.svg" alt="مأوى">
  <div id="result"><div class="spin"></div><p>جاري التحقق من العقد…</p></div>
</main>
<script>
const ENDPOINT='https://fivrwlowntwacfrsocge.supabase.co/functions/v1/contract-approval';
const params=new URLSearchParams(location.search);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-US').format(Number(n||0))+' ر.س';
const out=document.getElementById('result');
(async()=>{
  try{
    const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action:'verify',contract_id:params.get('c')||'',signature:params.get('s')||''})});
    const body=await res.json().catch(()=>({}));
    if(!res.ok||body.valid===false){
      out.innerHTML='<div class="icon bad">✕</div><h1>عقد غير موثّق</h1><p>هذا الرابط لا يطابق أي عقد معتمد لدى مؤسسة مأوى المهارة التجارية.<br>للتأكد تواصلوا معنا: info@maawaa.sa</p>';
      return;
    }
    const status=body.delivery_status;
    out.innerHTML='<div class="icon ok">✓</div><h1>عقد معتمد رسميًا</h1>'
      +(body.contract_number?'<div class="row"><span>رقم العقد</span><b>'+esc(body.contract_number)+'</b></div>':'')
      +(body.client_name?'<div class="row"><span>العميل</span><b>'+esc(body.client_name)+'</b></div>':'')
      +(body.total_amount?'<div class="row"><span>قيمة العقد</span><b>'+money(body.total_amount)+'</b></div>':'')
      +'<div class="row"><span>حالة الإرسال</span><span class="badge '+(status==='sent'?'sent':'pending')+'">'+(status==='sent'?'مرسل ومعتمد':'قيد الاعتماد')+'</span></div>'
      +'<p style="margin-top:14px;font-size:.78rem">هذه الصفحة مصدر رسمي للتحقق من عقود مأوى للتصوير العقاري.</p>';
  }catch(e){
    out.innerHTML='<div class="icon bad">!</div><h1>تعذر التحقق</h1><p>تحققوا من اتصالكم بالإنترنت ثم أعادوا المحاولة.</p>';
  }
})();
</script>
</body>
</html>
