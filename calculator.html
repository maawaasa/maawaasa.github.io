<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة أسعار التصوير العقاري في الرياض | مأوى للتصوير العقاري</title>
<meta name="description" content="احسب سعر تصوير عقارك فوراً في الرياض — تصوير فوتوغرافي HDR، فيديو سينمائي، درون 4K وجولات 360°.">
<link rel="canonical" href="https://maawaa.sa/calculator">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23020001'/%3E%3Ctext x='50' y='70' font-family='Arial' font-weight='900' font-size='54' fill='%23A4243B' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<script>
/* جسر توافق — الروابط القديمة calculator.html?t=&r=&u=&s=&a=&d= تُحوَّل إلى المسار النظيف ثم تُفتح الحاسبة مباشرة.
   البنية الجديدة: /calculator/<type>/<rooms>/<units>/<services>/<extras> */
(function(){
  var TYPES={studio:1,apartment:1,villa:1,office:1,land:1,project:1,palace:1,auction:1,resort:1};
  var ROOMLESS={land:1,auction:1,resort:1};
  var ROOMS_DEF={studio:1,apartment:2,villa:6,office:3,project:4,palace:12};
  var SVCS={photo:1,video:1,drone:1,vr360:1,ad:1};
  var p;
  try{ p=new URLSearchParams(location.search); }catch(e){ p=null; }
  var segs=[], ex=[];
  var t=p&&p.get('t');
  if(t&&TYPES[t]) segs.push(t);
  var rooms=p&&+p.get('r');
  if(t&&!ROOMLESS[t]&&rooms>0) segs.push(String(rooms));
  /* eu يلغي u (كما في الحاسبة سابقًا): العدد الكلي = 1 + مجموع كميات eu */
  var eu=(p&&p.get('eu'))||'';
  var units=(p&&+p.get('u'))||0, tot=units>0?units:1;
  if(eu){
    tot=1;
    eu.split(',').forEach(function(x){
      var m=x.match(/^(apartment|villa):(\d+):(\d+)$/);
      if(m){ tot+=(+m[3]||1); ex.push('u'+m[1]+'.'+(+m[2]||1)+'.'+(+m[3]||1)); }
    });
  }
  if(tot>1) segs.push(String(tot));
  /* عند تعدّد الوحدات بغياب r يلزم ذكر الغرف صراحة حتى لا يختلط الموضعان */
  if(tot>1&&t&&!ROOMLESS[t]&&!(rooms>0)&&ROOMS_DEF[t]) segs.splice(1,0,String(ROOMS_DEF[t]));
  var s=(p&&p.get('s'))||'';
  var sv=s.split(',').filter(function(k){return SVCS[k];});
  if(sv.length&&!(sv.length===1&&sv[0]==='photo')) segs.push(sv.join('+'));
  var a=(p&&p.get('a'))||'';
  if(a.split(',').indexOf('r')>=0) ex.push('rush');
  var d=(p&&p.get('d'))||'';
  if(d.split(',').indexOf('l')>=0) ex.push('logo');
  if(d.split(',').indexOf('g')>=0) ex.push('sign');
  d.split(',').forEach(function(x){ if(/^p\d+$/.test(x)) ex.push(x); });
  if(ex.length) segs.push(ex.join('+'));
  /* كل القيم افتراضية → /calculator مباشرة */
  if(segs.length===2&&segs[0]==='apartment'&&segs[1]==='2') segs=[];
  var qs=(p&&p.get('dryrun')==='1'&&(location.hostname==='127.0.0.1'||location.hostname==='localhost'))?'?dryrun=1':'';
  location.replace('/calculator'+(segs.length?'/'+segs.join('/'):'')+qs);
})();
</script>
</head>
<body style="font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:#020001;color:#FBFAF6;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center">
<noscript><p>جاري نقل حاسبة الأسعار إلى عنوانها الجديد.</p><p><a href="/calculator/" style="color:#7AAAD4">افتح حاسبة الأسعار</a></p></noscript>
</body>
</html>
